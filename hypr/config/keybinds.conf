source = ~/.config/hypr/config/defaults.conf

# https://wiki.hyprland.org/Configuring/Binds
bindd = $mod, RETURN, Opens your preferred terminal emulator ($terminal), exec, $terminal
bindd = $mod, SPACE, Runs your application launcher, exec, $applauncher
bindd = $mod, E, Opens your preferred filemanager ($filemanager), exec, $filemanager
bindd = $mod, Q, Closes (not kill) current window, killactive,
bindd = $mod, V, Switches current window between floating and tiling mode, togglefloating
bindd = $mod, S, Switches the swallow state of a window, toggleswallow
bindd = $mod, F, Toggles current window fullscreen mode, fullscreen
bindd = $mod, Y, Pin current window (shows on all workspaces), pin
# bindd = $mod, J, Toggles current window split mode, togglesplit, # dwindle
bindd = $mod SHIFT, M, Exits Hyprland by terminating the user sessions, exec, loginctl terminate-user ""

bindd = , Print, Creates a screenshot of an area, exec, grimblast --notify copy area
bindd = CTRL, Print, Creates a screenshot of the active window, exec, grimblast --notify copy active
bindd = ALT, Print, Save a screenshot of the active display, exec, grimblast --freeze --notify copysave output

bindd = $mod SHIFT, C, Pick a color on screen, exec, hyprpicker -a

# ======= Grouping Windows =======

bindd = $mod, K, Toggles current window group mode (ungroup all related), togglegroup,
bindd = $mod, Tab, Switches to the next window in the group, changegroupactive, f
bindd = ALT, Tab, Switches to the next window, cyclenext, prev
bindd = ALT, Tab, And bring it to top, alterzorder, top

# ======= Toggle Gaps =======

bindd = $mod SHIFT, G, Set CachyOS default gaps, exec, hyprctl --batch "keyword general:gaps_out 5;keyword general:gaps_in 3"
bindd = $mod, G, Remove gaps between window, exec, hyprctl --batch "keyword general:gaps_out 0;keyword general:gaps_in 0"

# ======= Volume Control =======

bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% && pactl get-sink-volume @DEFAULT_SINK@ | grep -oP '\d+(?=%)' | awk '{if($1>100) system("pactl set-sink-volume @DEFAULT_SINK@ 100%")}' && pactl get-sink-volume @DEFAULT_SINK@ | grep -oP '\d+(?=%)' | awk '{print $1}' | head -1 > /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob # Raise Volume
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% && pactl get-sink-volume @DEFAULT_SINK@ | grep -oP '\d+(?=%)' | awk '{print $1}' | head -1 > /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob # Lower Volume
bindel = , XF86AudioMute, exec, amixer sset Master toggle | sed -En '/\[on\]/ s/.*\[([0-9]+)%\].*/\1/ p; /\[off\]/ s/.*/0/p' | head -1 > /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob	#Mutes player audio

# ======= Playback Control =======

bindd = , XF86AudioPlay, Toggles play/pause, exec, playerctl play-pause
bindd = , XF86AudioNext, Next track, exec, playerctl next
bindd = , XF86AudioPrev, Previous track, exec, playerctl previous

# ======= Screen Brightness =======

bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5% 	#Increases brightness 5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%- 	#Decreases brightness 5%
bindd = $mod, L, Lock the screen, exec, hyprlock
bindd = $mod, O, Reload/restarts Waybar, exec, killall -SIGUSR2 waybar

# ======= Window Actions =======

## Move window with mod + LMB/RMB and dragging
bindd = $mod, $mouseleft, Move the window towards a direction, movewindow
## Move window towards a direction
bindd = $mod SHIFT, left, Move active window to the left, movewindow, l
bindd = $mod SHIFT, right, Move active window to the right, movewindow, r
bindd = $mod SHIFT, up, Move active window upwards, movewindow, u
bindd = $mod SHIFT, down, Move active window downwards, movewindow, d
## Move focus with mod + arrow keys
bindd = $mod, left, Move focus to the left, movefocus, l
bindd = $mod, right,  Move focus to the right, movefocus, r
bindd = $mod, up, Move focus upwards, movefocus, u
bindd = $mod, down, Move focus downwards, movefocus, d

## Resizing windows
# Activate keyboard window resize mode
# https://wiki.hyprland.org/Configuring/Binds/#submaps
bindd = $mod, R, Activates window resizing mode, submap, resize
submap = resize
# bindd = , right, Resize to the right (resizing mode), resizeactive, 15 0
# bindd = , left, Resize to the left (resizing mode), resizeactive, -15 0
bindd = , up, Resize larger (resizing mode), resizeactive, -20 -20
bindd = , down, Resize smaller (resizing mode), resizeactive, 20 20
bindd = , l, Resize to the right (resizing mode), resizeactive, 20 0
bindd = , h, Resize to the left (resizing mode), resizeactive, -20 0
bindd = , k, Resize upwards (resizing mode), resizeactive, 0 -20
bindd = , j, Resize downwards (resizing mode), resizeactive, 0 20
bindd = , escape, Ends window resizing mode, submap, reset
submap = reset
# Quick resize window with keyboard
# !!! added $mod here because CTRL + SHIFT is used for word selection in various text editors
bindd = $mod CTRL SHIFT, right, Resize to the right, resizeactive, 15 0
bindd = $mod CTRL SHIFT, left, Resize to the left, resizeactive, -15 0
bindd = $mod CTRL SHIFT, up, Resize upwards, resizeactive, 0 -15
bindd = $mod CTRL SHIFT, down, Resize downwards, resizeactive, 0 15
bindd = $mod CTRL SHIFT, l, Resize to the right, resizeactive, 15 0
bindd = $mod CTRL SHIFT, h, Resize to the left, resizeactive, -15 0
bindd = $mod CTRL SHIFT, k, Resize upwards, resizeactive, 0 -15
bindd = $mod CTRL SHIFT, j, Resize downwards, resizeactive, 0 15
# Resize window with mod + LMB/RMB and dragging
bindm = $mod, $mouseleft, movewindow		# Drag window
bindm = $mod, $mouseright, resizewindow		# Resize the window towards a direction
# Resize with mouse only
# bind = , $mouseside, submap, resizemouse
# submap = resizemouse
# bindm = , $mouseleft, movewindow
# bindm = , $mouseright, resizewindow
# bind = , $mouseside, submap, reset
# submap = reset
# Disable resize with mouse
# bind = $mod, $mouseside, submap, nomouseresize
# submap = nomouseresize
# bind = $mod, $mouseside, submap, reset
# submap = reset
## Resizing Windows End #

## Move active window to a workspace with $mod + CTRL + [0-9]
bindd = $mod CTRL, 1, Move window and switch to workspace 1, movetoworkspace, 1
bindd = $mod CTRL, 2, Move window and switch to workspace 2, movetoworkspace, 2
bindd = $mod CTRL, 3, Move window and switch to workspace 3, movetoworkspace, 3
bindd = $mod CTRL, 4, Move window and switch to workspace 4, movetoworkspace, 4
bindd = $mod CTRL, 5, Move window and switch to workspace 5, movetoworkspace, 5
bindd = $mod CTRL, 6, Move window and switch to workspace 6, movetoworkspace, 6
bindd = $mod CTRL, 7, Move window and switch to workspace 7, movetoworkspace, 7
bindd = $mod CTRL, 8, Move window and switch to workspace 8, movetoworkspace, 8
bindd = $mod CTRL, 9, Move window and switch to workspace 9, movetoworkspace, 9
bindd = $mod CTRL, 0, Move window and switch to workspace 10, movetoworkspace, 10
bindd = $mod CTRL, left, Move window and switch to the next workspace, movetoworkspace, -1
bindd = $mod CTRL, right, Move window and switch to the previous workspace, movetoworkspace, +1
## Same as above, but doesn't switch to the workspace
bindd = $mod SHIFT, 1, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = $mod SHIFT, 2, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = $mod SHIFT, 3, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = $mod SHIFT, 4, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = $mod SHIFT, 5, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = $mod SHIFT, 6, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = $mod SHIFT, 7, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = $mod SHIFT, 8, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = $mod SHIFT, 9, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = $mod SHIFT, 0, Move window silently to workspace 10, movetoworkspacesilent, 10
# Window actions End #

# ======= Workspace Actions =======

# Switch workspaces with mod + [0-9]
bindd = $mod, 1, Switch to workspace 1, workspace, 1
bindd = $mod, 2, Switch to workspace 2, workspace, 2
bindd = $mod, 3, Switch to workspace 3, workspace, 3
bindd = $mod, 4, Switch to workspace 4, workspace, 4
bindd = $mod, 5, Switch to workspace 5, workspace, 5
bindd = $mod, 6, Switch to workspace 6, workspace, 6
bindd = $mod, 7, Switch to workspace 7, workspace, 7
bindd = $mod, 8, Switch to workspace 8, workspace, 8
bindd = $mod, 9, Switch to workspace 9, workspace, 9
bindd = $mod, 0, Switch to workspace 10, workspace, 10
# Scroll through existing workspaces with mod + , or .
bindd = $mod, PERIOD, Scroll through workspaces incrementally, workspace, e+1
bindd = $mod, COMMA, Scroll through workspaces decrementally, workspace, e-1
# With $mod + scroll
bindd = $mod, mouse_down, Scroll through workspaces incrementally, workspace, e-1
bindd = $mod, mouse_up, Scroll through workspaces decrementally, workspace, e+1
bindd = $mod, slash, Switch to the previous workspace, workspace, previous
# Special workspaces (scratchpads)
bindd = $mod, minus, Move active window to Special workspace, movetoworkspace, special
bindd = $mod, equal, Toggles the Special workspace, togglespecialworkspace, special
# bindd = $mod, F1, Call special workspace scratchpad, togglespecialworkspace, scratchpad
# bindd = $mod ALT SHIFT, F1, Move active window to special workspace scratchpad, movetoworkspacesilent, special:scratchpad

# ======= Additional Settings =======

# https://wiki.hyprland.org/Configuring/Binds
binds {
    allow_workspace_cycles = 1
    workspace_back_and_forth = 1
    workspace_center_on = 1
    movefocus_cycles_fullscreen = true
    window_direction_monitor_fallback = true
}

