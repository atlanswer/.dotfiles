source = ~/.config/hypr/config/colors.conf

# https://wiki.hypr.land/Configuring/Variables

general {
    border_size = 2
    gaps_in = 1
    gaps_out = 1
    float_gaps = 1
    gaps_workspaces = 1
    col.active_border = $sky_700
    col.inactive_border = $sky_900
    layout = dwindle # dwindle, master, scrolling, monocle
    resize_on_border = true
    extend_border_grab_area = 12
    resize_corner = 3

    snap {
        enabled = true
    }
}

decoration {
    rounding = 6
    rounding_power = 2.0

    blur {
        enabled = true
        size = 8
        passes = 1
        xray = true
    }

    shadow {
        enabled = true
        range = 4
        render_power = 2
    }
}

input {
    repeat_rate = 25
    repeat_delay = 600
    accel_profile = flat
    follow_mouse = 2
    float_switch_override_focus = 2
}

group {
    auto_group = true
    col.border_active = $fuchsia_700
    col.border_inactive = $fuchsia_900
    col.border_locked_active = $pink_700
    col.border_locked_inactive = $pink_900

    groupbar {
        enabled = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    font_family = "Noto Sans"
    vrr = 3
    enable_swallow = true
    swallow_regex = ^(zen|nautilus)$
    focus_on_activate = true
    background_color = $green_500
    # render_unfocused_fps = 60
}

binds {
    allow_pin_fullscreen = true
}

xwayland {
}

opengl {
}

render {
    direct_scanout = 2
    cm_enabled = true
    cm_auto_hdr = 0
}

ecosystem {
    # enforce_permissions = true
}

quirks {
    prefer_hdr = 0
}

dwindle {
    force_split = 2
    smart_resizing = true
    special_scale_factor = 0.765
    use_active_for_splits = true
}

master {
    new_status = master
    special_scale_factor = 0.765
}

