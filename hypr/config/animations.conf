# https://wiki.hyprland.org/Configuring/Animations

animations {
    enabled = yes
    animation = windows, 1, 3, default, popin 75%
    animation = border, 1, 3, default
    animation = workspacesIn, 1, 3, default, slide
    animation = workspacesOut, 1, 3, default, slidefade
    animation = specialWorkspaceIn, 1, 3, default, slidevert -75%
    animation = specialWorkspaceOut, 1, 3, default, slidefadevert -75%
}
